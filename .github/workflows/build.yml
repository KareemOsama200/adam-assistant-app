name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build with Gradle (Mock APK Generator)
        run: |
          echo "Building Adam Assistant APK..."
          mkdir -p output
          echo "Adam Assistant APK for Center Adam" > output/Adam-Assistant.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Adam-Assistant-APK
          path: output/Adam-Assistant.apk
